<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Mobile / PWA viewport -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <!--
      Stale-deploy recovery.

      This MUST be inline, and MUST run before the module script: the failure it
      recovers from is an index.html that a cache served from an older deploy,
      still pointing at hashed bundles the server no longer has. Those 404, the
      app's entry module never executes, and the page is a white screen — so
      nothing shipped inside the bundle can repair it. A reload refetches
      index.html and picks up the current hashes.
    -->
    <script>
      (function () {
        var KEY = 'jou3an:stale-reload'
        // A reload-loop retries within seconds, so a cooldown is enough to make
        // looping impossible — while still letting a long-lived tab recover
        // from a *later* deploy instead of being stuck for the whole session.
        var COOLDOWN_MS = 10 * 60 * 1000

        function recover(what) {
          var now = Date.now()
          try {
            var last = Number(sessionStorage.getItem(KEY) || 0)
            if (last && now - last < COOLDOWN_MS) return
            sessionStorage.setItem(KEY, String(now))
          } catch (err) {
            // Storage blocked (private mode, third-party context). Without the
            // guard we cannot prove we won't loop, so decline to reload.
            return
          }

          if (window.console && console.warn) {
            console.warn('[jou3an] stale asset (' + what + ') — reloading once')
          }

          // A cache-first service worker would just re-serve the same stale
          // HTML, so drop its caches before reloading.
          var reload = function () {
            location.reload()
          }
          if (
            window.caches &&
            navigator.serviceWorker &&
            navigator.serviceWorker.controller
          ) {
            caches
              .keys()
              .then(function (keys) {
                return Promise.all(
                  keys.map(function (k) {
                    return caches.delete(k)
                  }),
                )
              })
              .then(reload, reload)
          } else {
            reload()
          }
        }

        // Resource load errors do not bubble, so this has to be capture phase.
        window.addEventListener(
          'error',
          function (e) {
            var el = e.target
            if (!el || el === window) return
            var url = el.src || el.href
            if (!url) return
            // Only our own assets. A font CDN blip is not a stale deploy, and
            // reloading on it would be both useless and user-hostile.
            if (url.lastIndexOf(location.origin, 0) !== 0) return

            if (el.tagName === 'SCRIPT') recover(url)
            else if (
              el.tagName === 'LINK' &&
              (el.rel === 'stylesheet' || el.rel === 'modulepreload')
            ) {
              recover(url)
            }
          },
          true,
        )

        // Vite dispatches this when a lazy chunk's preload fails after boot.
        window.addEventListener('vite:preloadError', function (e) {
          if (e.preventDefault) e.preventDefault()
          recover('vite:preloadError')
        })
      })()
    </script>

    <!-- Motion gate. Must run BEFORE first paint: index.css only hides
         reveal-on-scroll content under `html.js`, so that content stays
         visible for anything that never runs this script. -->
    <script>
      document.documentElement.classList.add('js')
    </script>

    <!-- Favicons — the standalone red "3" mark (transparent, reads on both
         light and dark browser chrome) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/jou3an-icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/jou3an-icon-180.png" />

    <!-- PWA -->
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Jou3an" />

    <!-- SEO -->
    <meta
      name="description"
      content="Dubai's food decision engine. Tell us what you're craving and get exactly 3 places to eat — no menus, no scrolling, just a decision. Join the waitlist."
    />
    <link rel="canonical" href="https://www.jou3an.me/" />

    <!-- Open Graph (WhatsApp, Instagram, Facebook, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jou3an" />
    <meta property="og:url" content="https://www.jou3an.me" />
    <meta property="og:title" content="Jou3an — Hungry? We decide for you." />
    <meta
      property="og:description"
      content="Dubai's food decision engine. Tell us what you're craving and get exactly 3 places to eat — no menus, no scrolling, just a decision."
    />
    <meta
      property="og:image"
      content="https://www.jou3an.me/brand/jou3an-logo-black.jpeg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1080" />
    <meta property="og:image:height" content="1350" />
    <meta property="og:image:alt" content="Jou3an" />
    <meta property="og:locale" content="en_AE" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Jou3an — Hungry? We decide for you." />
    <meta
      name="twitter:description"
      content="Dubai's food decision engine. Tell us what you're craving and get exactly 3 places to eat — no menus, no scrolling, just a decision."
    />
    <meta
      name="twitter:image"
      content="https://www.jou3an.me/brand/jou3an-logo-black.jpeg"
    />
    <meta name="twitter:image:alt" content="Jou3an" />

    <!-- Fonts: self-hosted, latin subset, same origin. @font-face lives in
         src/index.css. Only Syne is preloaded — the hero headline is the LCP
         element, and the other two faces are not on the critical path. -->
    <!-- All three faces preloaded. With the page prerendered, text paints
         before React boots — if the fonts are still in flight at that paint,
         the fallback-to-webfont swap reflows the hero and shows up as CLS
         (measured 0.031). 100 KB across the set, same origin, worth it. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/syne-latin-var.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/dm-sans-latin-var.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/instrument-serif-latin-italic.woff2"
      crossorigin
    />


    <title>Jou3an — Hungry? We decide for you.</title>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

  </body>
</html>
