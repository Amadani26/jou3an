<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Mobile / PWA viewport -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#080808" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Jou3an" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&family=DM+Sans:opsz,wght@9..40,300..600&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0"
      rel="stylesheet"
    />

    <title>Jou3an</title>

    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        background: #080808;
        transition: opacity 0.4s ease;
      }
      #splash.hide {
        opacity: 0;
        pointer-events: none;
      }
      #splash .wordmark {
        font-family: 'Syne', sans-serif;
        font-weight: 800;
        font-size: 3rem;
        letter-spacing: -0.02em;
        color: #f2ede8;
      }
      #splash .wordmark span {
        color: #e8272a;
      }
      #splash .ar {
        font-size: 1rem;
        color: #e8272a;
      }
    </style>
  </head>
  <body>
    <!-- App splash (fades out once React mounts) -->
    <div id="splash">
      <div class="wordmark">Jou<span>3</span>an</div>
      <div class="ar" dir="rtl">جوعان</div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <script>
      // Hide the splash: immediately if the app is already cached/controlled by
      // the service worker, otherwise fade out shortly after load.
      (function () {
        function hideSplash() {
          var el = document.getElementById('splash')
          if (!el) return
          el.classList.add('hide')
          setTimeout(function () {
            if (el && el.parentNode) el.parentNode.removeChild(el)
          }, 450)
        }
        window.__hideSplash = hideSplash

        if (
          navigator.serviceWorker &&
          navigator.serviceWorker.controller
        ) {
          // Already cached — don't linger on the splash.
          hideSplash()
        } else {
          window.addEventListener('load', function () {
            setTimeout(hideSplash, 400)
          })
        }
      })()
    </script>
  </body>
</html>
